# 통합 테스트 전용 Spring 설정 (운영/개발용 application.properties 는 수정하지 않는다).
# 백엔드를 아래처럼 띄우면 이 파일 값이 application.properties 보다 우선한다.
#   ./gradlew bootRun --args=--spring.config.additional-location=file:<이 파일의 절대경로>
# run.sh 가 자동으로 이렇게 실행한다.

# finalize / feedback 요청이 실제 LLM 서버가 아니라 로컬 가상 LLM 으로만 가도록 한다.
# 시뮬레이터의 가상 LLM 도 이 주소의 포트를 읽어서 뜬다.
llm.base-url=http://127.0.0.1:18001

# 테스트 로그를 읽기 쉽게 SQL 출력만 끈다 (DB 스키마/데이터에는 영향 없음).
spring.jpa.show-sql=false
