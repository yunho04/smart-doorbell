spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/smart_doorbell
spring.datasource.username=choiyunho
spring.datasource.password=

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

mqtt.broker-url=tcp://localhost:1883
mqtt.client-id=smart-doorbell-backend
mqtt.topic=doorbell/+/sensor
mqtt.outbound-client-id=smart-doorbell-backend-out

llm.base-url=${LLM_BASE_URL:http://localhost:8001}
app.auth.password=${APP_AUTH_PASSWORD:smartdoorbell}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
server.address=0.0.0.0
server.port=8080
